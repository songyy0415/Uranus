plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    // Inject the common access widener into the fabric jar as `uranus.accesswidener`
    // (referenced by fabric.mod.json), since loom-no-remap has no separate remap step.
    injectAccessWidener(tasks.named('jar'))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // loom-no-remap (MC 26.2) has no `modImplementation` config — plain `api`/`implementation` is used.
    api "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    api "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API (compiled against + bundled into the jar via shadowBundle).
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    shadowBundle "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // The access widener and mixin config live in the common module's resources.
    // Loom's dev launcher requires files referenced by fabric.mod.json (accessWidener,
    // mixins) to be inside the mod's own files (fabric/build/resources/main), not the
    // common jar on the classpath — copy them so both dev runs and the production jar
    // resolve them. Single source of truth stays in :common.
    from(project(':common').file('src/main/resources/uranus.accesswidener'))
    from(project(':common').file('src/main/resources/uranus.mixins.json'))
}

jar {
    // loom-no-remap has no remapJar; the shadowJar below is the final artifact.
    // The raw jar carries the injected access widener, which shadowJar copies.
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    zip64 = true
}

assemble.dependsOn shadowJar
