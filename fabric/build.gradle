plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    // Inject the common access widener into the fabric jar as `uranus.accesswidener`
    // (referenced by fabric.mod.json), since loom-no-remap has no separate remap step.
    injectAccessWidener(tasks.named('jar'))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Dependencies in this configuration are copied VERBATIM (as .jar blobs) into
    // META-INF/jars/ of the production jar, and each one must be declared in
    // fabric.mod.json's "jars" list. FabricLoader loads them as separate mods — their
    // own fabric.mod.json, mixins and accessWidener all apply. This is the loom-no-remap
    // equivalent of the old `include("dev.architectury:architectury-fabric")`.
    // Only architectury-fabric is nested here; its transitive deps (fabric-loader,
    // fabric-api modules) are installed in production and must NOT be bundled into uranus,
    // so transitive resolution is disabled.
    nestedJars {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // loom-no-remap (MC 26.2) has no `modImplementation` config — plain `api`/`implementation` is used.
    api "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    api "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. Compiled against for dev/runtime, and nested as a mod jar
    // (META-INF/jars) in the production jar so its mixins/accessWidener apply.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    nestedJars "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // The access widener and mixin config live in the common module's resources.
    // Loom's dev launcher requires files referenced by fabric.mod.json (accessWidener,
    // mixins) to be inside the mod's own files (fabric/build/resources/main), not the
    // common jar on the classpath — copy them so both dev runs and the production jar
    // resolve them. Single source of truth stays in :common.
    from(project(':common').file('src/main/resources/uranus.accesswidener'))
    from(project(':common').file('src/main/resources/uranus.mixins.json'))
}

jar {
    // loom-no-remap has no remapJar; this standard Jar task IS the final artifact.
    // (Shadow's shadowJar can't be used here: its from(zipTree) recursively re-expands
    // any nested .jar entry, so a bundled mod jar would be torn apart and its classes
    // dumped into the jar root. A plain Gradle Jar keeps a .jar source as a blob.)
    archiveClassifier = null

    // Merge the common module's transformed classes/resources into the final jar.
    // shadowBundle holds exactly project(':common', transformProductionFabric).
    from(zipTree(project.configurations.shadowBundle.singleFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // architectury-fabric as a nested mod jar, verbatim, under META-INF/jars.
    // Standard Gradle Jar semantics keep a .jar source as a single blob entry rather
    // than expanding it. Renamed to a stable name so fabric.mod.json's "jars" path
    // doesn't track the architectury version.
    from(project.configurations.nestedJars) {
        into 'META-INF/jars'
        rename { it.replaceFirst(/architectury-fabric-.*\.jar$/, 'architectury-fabric.jar') }
    }

    zip64 = true
}

assemble.dependsOn jar
